baseURL = "https://rockyflux.github.io/ai-guide/"
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false
theme = 'hugo-book'

[languages]
  [languages.zh]
    languageName = '中文'
    languageCode = 'zh-CN'
    weight = 1
    title = 'AI 编程全链路指南'
    contentDir = 'content.zh'
    [languages.zh.params]
      BookRepo = 'https://github.com/rockyflux/ai-guide'
      BookEditPage = true
      BookSearch = true
      BookSection = '*'
      BookMenuBundle = '/menu'
      BookToC = true
      BookComments = false
      BookPortableLinks = true
      BookServiceWorker = true
      BookCollapseSection = true
      BookMenuCollapse = true
      BookSectionCollapse = true
      BookMenuFold = true

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      attribute = true
    [markup.goldmark.renderer]
      unsafe = true

# 菜单配置
# menu.before: 显示在文件树菜单之前
# menu.after: 显示在文件树菜单之后

[params]
  BookTheme = 'auto'  # light / dark / auto
  BookFooter = '<div style="opacity:.75;font-size:1em;padding-top:3em;">© 2026 AI编程实践教程 · <a href="https://github.com/rockyflux/ai-guide" target="_blank" rel="noopener">GitHub</a></div>'
  BookBackToTop = true
  BookBackToTopThreshold = 300
  BookRepo = 'https://github.com/rockyflux/ai-guide'
  BookCommitPath = 'commit'
  BookEditPath = 'edit/main'
  BookEditPage = true
  BookSearch = true
  BookSection = '*'
  BookMenuBundle = '/menu'
  BookToC = true
  BookServiceWorker = true
  BookCollapseSection = true
  BookMenuCollapse = true
  BookSectionCollapse = true
  BookMenuFold = true
