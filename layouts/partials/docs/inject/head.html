{{- /* 站点自定义样式，在主题 CSS 之后加载以覆盖主题 */ -}}
{{- with resources.Get "custom.scss" -}}
  {{- $custom := . | css.Sass | resources.Minify | resources.Fingerprint -}}
  <link rel="stylesheet" href="{{ $custom.RelPermalink }}">
{{- end -}}

<!-- 自定义站点图标（favicon） -->
<link rel="icon" href="{{ "images/index/favicon.png" | relURL }}" type="image/x-icon">
<link rel="icon" type="image/png" href="{{ "images/index/favicon.png" | relURL }}">
<link rel="shortcut icon" type="image/png" href="{{ "images/index/favicon.png" | relURL }}">
